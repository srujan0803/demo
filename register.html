<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Kreeda Registration</title>
  <link rel="stylesheet" href="styles.css" />
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f4f4f4;
    }

    .register-container {
      max-width: 600px;
      margin: 120px auto;
      background: #ffffff;
      padding: 30px;
      border-radius: 20px;
      box-shadow: 0 8px 16px rgba(0,0,0,0.1);
    }

    .register-container h2 {
      text-align: center;
      margin-bottom: 25px;
      color: #333;
    }

    .nav-tabs {
      display: flex;
      justify-content: center;
      gap: 15px;
      margin-bottom: 20px;
    }

    .nav-tabs a {
      text-decoration: none;
      background-color: white;
      color: #080808;
      padding: 10px 20px;
      border-radius: 25px;
      font-size: 16px;
      font-weight: bold;
      transition: background 0.3s;
    }

    .nav-tabs a:hover {
      background-color: #cffcf3;
    }

    form label {
      display: block;
      margin-top: 15px;
      font-weight: bold;
      color: #222;
    }

    form input, form select {
      width: 100%;
      padding: 10px;
      margin-top: 5px;
      border-radius: 10px;
      border: 1px solid #ccc;
      font-size: 16px;
    }

    .gender-options {
      display: flex;
      justify-content: space-between;
      margin-top: 10px;
    }

    .gender-options label {
      font-weight: normal;
    }

    .register-btn {
      width: 100%;
      background-color: rgb(71, 226, 71);
      color: #000;
      border: none;
      padding: 12px;
      font-size: 18px;
      border-radius: 25px;
      margin-top: 25px;
      cursor: pointer;
      font-weight: bold;
      transition: background-color 0.3s;
    }

    .register-btn:hover {
      background-color: #58c258;
    }
  </style>
</head>
<body>

  <div class="register-container">
    <div class="nav-tabs">
      <a href="play.html">Play🏏</a>
      <a href="book.html">Book🎟</a>
      <a href="train.html">Training💪🏽</a>
    </div>

    <h2>Register for Training / Tournament</h2>

    <form id="registrationForm">
      <label for="name">Full Name</label>
      <input type="text" id="name" name="name" required>

      <label for="age">Age</label>
      <input type="number" id="age" name="age" required min="5">

      <label>Gender</label>
      <div class="gender-options">
        <label><input type="radio" name="gender" value="Male" required> Male</label>
        <label><input type="radio" name="gender" value="Female"> Female</label>
        <label><input type="radio" name="gender" value="Other"> Other</label>
      </div>

      <label for="phone">Contact Number</label>
      <input type="tel" id="phone" name="phone" pattern="[0-9]{10}" placeholder="10-digit number" required>

      <label for="email">Email</label>
      <input type="email" id="email" name="email" required>

      <label for="sport">Preferred Sport</label>
      <select id="sport" name="sport" required>
        <option value="">--Select Sport--</option>
        <option value="Cricket">Cricket</option>
        <option value="Football">Football</option>
        <option value="Tennis">Tennis</option>
        <option value="Badminton">Badminton</option>
        <option value="Swimming">Swimming</option>
      </select>

      <label for="academy">Preferred Academy</label>
      <input type="text" id="academy" name="academy" required>

      <button type="submit" class="register-btn">Register</button>
    </form>
  </div>

  <script>
    document.getElementById('registrationForm').addEventListener('submit', function(e) {
      e.preventDefault(); // Prevent actual form submission

      // Display success message and redirect
      alert("✅ Successfully registered!");
      window.location.href = "index.html"; // Redirect to homepage
    });
  </script>

</body>
</html>
